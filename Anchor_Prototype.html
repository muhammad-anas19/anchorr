document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

12 · heading: Cancellation<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closeDrawer }}\" aria-label=\"Close\" style=\"width:26px; height:26px; border:1px solid var(--border); background:var(--surface); border-radius:6px; cursor:pointer; color:var(--muted); display:grid; place-items:center\" style-hover=\"color:var(--fg)\">\n            <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M4 4l8 8M12 4l-8 8\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"flex:1; overflow-y:auto; padding:18px 20px\">\n          <div style=\"display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:18px\">\n            <div style=\"border:1px solid var(--border); border-radius:8px; padding:10px\"><div style=\"font-size:11px; color:var(--muted)\">Relevance<\u002Fdiv><div style=\"font:500 14px/1 'IBM Plex Mono',monospace; margin-top:6px; color:var(--ok)\">94%<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid var(--border); border-radius:8px; padding:10px\"><div style=\"font-size:11px; color:var(--muted)\">Vector<\u002Fdiv><div style=\"font:500 14px/1 'IBM Plex Mono',monospace; margin-top:6px\">0.91<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid var(--border); border-radius:8px; padding:10px\"><div style=\"font-size:11px; color:var(--muted)\">Keyword<\u002Fdiv><div style=\"font:500 14px/1 'IBM Plex Mono',monospace; margin-top:6px\">0.88<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:600 10.5px/1 'Instrument Sans',sans-serif; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); margin-bottom:10px\">Excerpt<\u002Fdiv>\n          <div style=\"font-size:13.5px; line-height:1.75; color:var(--fg)\">\n            <p style=\"margin:0 0 12px; color:var(--muted)\">…charges appear on the invoice for the period in which they occur.<\u002Fp>\n            <p style=\"margin:0 0 12px\"><mark style=\"background:var(--accent-soft); color:var(--fg); padding:2px 3px; border-radius:3px\">You can cancel your subscription at any time from Settings → Billing. Select Cancel plan and confirm. Your workspace stays on the current plan until the end of the billing period, after which it moves to the Free tier.<\u002Fmark><\u002Fp>\n            <p style=\"margin:0 0 12px\"><mark style=\"background:var(--accent-soft); color:var(--fg); padding:2px 3px; border-radius:3px\">Cancelling does not delete your documents or conversation history.<\u002Fmark> Usage above the Free tier limits is invoiced on the final invoice for the period.<\u002Fp>\n            <p style=\"margin:0; color:var(--muted)\">Reactivating a cancelled workspace restores the previous plan…<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none; display:flex; gap:8px; padding:14px 20px; border-top:1px solid var(--border); background:var(--surface-2)\">\n          <button sc-camel-on-click=\"{{ go.document }}\" style=\"flex:1; height:32px; border-radius:7px; background:var(--surface); border:1px solid var(--border); color:var(--fg); font:500 12.5px/1 'Instrument Sans',sans-serif; cursor:pointer\">Open document<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ closeDrawer }}\" style=\"flex:1; height:32px; border-radius:7px; background:var(--btn-bg); border:0; color:var(--btn-fg); font:500 12.5px/1 'Instrument Sans',sans-serif; cursor:pointer\">Done<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ uploadOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; background:rgba(12,12,16,.44); display:grid; place-items:center; padding:24px; z-index:60\">\n      <div role=\"dialog\" aria-modal=\"true\" aria-label=\"Upload document\" style=\"width:100%; max-width:520px; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:0 18px 48px rgba(10,10,14,.24); overflow:hidden\">\n        <div style=\"display:flex; align-items:flex-start; gap:12px; padding:18px 20px 0\">\n          <div style=\"flex:1\">\n            <div style=\"font:600 16px/1.3 'Instrument Sans',sans-serif\">Upload document<\u002Fdiv>\n            <p style=\"margin:5px 0 0; font-size:12.5px; color:var(--muted)\">PDF or DOCX, up to 50 MB each.<\u002Fp>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closeUpload }}\" aria-label=\"Close\" style=\"width:26px; height:26px; border:1px solid var(--border); background:var(--surface); border-radius:6px; cursor:pointer; color:var(--muted); display:grid; place-items:center\" style-hover=\"color:var(--fg)\">\n            <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M4 4l8 8M12 4l-8 8\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"padding:16px 20px 20px\">\n          <div style=\"border:1.5px dashed var(--accent); background:var(--accent-soft); border-radius:10px; padding:28px 20px; text-align:center\">\n            <div style=\"width:36px; height:36px; margin:0 auto 12px; border-radius:9px; background:var(--surface); border:1px solid var(--border); display:grid; place-items:center; color:var(--accent-fg)\">\n              <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M8 11V3.5\"><\u002Fpath><path d=\"M5 6.5L8 3.5l3 3\"><\u002Fpath><path d=\"M3 11.5v1A1.5 1.5 0 0 0 4.5 14h7a1.5 1.5 0 0 0 1.5-1.5v-1\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"font:600 13.5px/1.3 'Instrument Sans',sans-serif\">Drop PDF or DOCX files here<\u002Fdiv>\n            <div style=\"font-size:12.5px; color:var(--muted); margin-top:5px\">or <span style=\"color:var(--accent-fg); text-decoration:underline; cursor:pointer\">browse files<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px; display:flex; flex-direction:column; gap:8px\">\n            <div style=\"display:flex; align-items:center; gap:11px; padding:10px 12px; border:1px solid var(--border); border-radius:9px\">\n              <span style=\"flex:none; font:600 9.5px/1 'IBM Plex Mono',monospace; color:var(--err); background:var(--err-soft); padding:4px; border-radius:4px\">PDF<\u002Fspan>\n              <div style=\"flex:1; min-width:0\">\n                <div style=\"display:flex; gap:8px; align-items:baseline\"><span style=\"font:500 12.5px/1 'Instrument Sans',sans-serif; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">Returns &amp; Exchanges 2026.pdf<\u002Fspan><span style=\"font:400 11px/1 'IBM Plex Mono',monospace; color:var(--faint)\">3.1 MB<\u002Fspan><\u002Fdiv>\n                <div style=\"height:4px; border-radius:3px; background:var(--track); margin-top:8px; overflow:hidden\"><div style=\"width:78%; height:100%; background:var(--accent)\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font:400 11.5px/1 'IBM Plex Mono',monospace; color:var(--muted)\">78%<\u002Fspan>\n              <button aria-label=\"Cancel upload\" style=\"width:22px; height:22px; border:0; background:transparent; color:var(--faint); cursor:pointer; display:grid; place-items:center\" style-hover=\"color:var(--err)\">\n                <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M4 4l8 8M12 4l-8 8\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:11px; padding:10px 12px; border:1px solid var(--border); border-radius:9px\">\n              <span style=\"flex:none; font:600 9.5px/1 'IBM Plex Mono',monospace; color:var(--accent-fg); background:var(--accent-soft); padding:4px; border-radius:4px\">DOC<\u002Fspan>\n              <div style=\"flex:1; min-width:0\">\n                <div style=\"display:flex; gap:8px; align-items:baseline\"><span style=\"font:500 12.5px/1 'Instrument Sans',sans-serif\">Onboarding Checklist.docx<\u002Fspan><span style=\"font:400 11px/1 'IBM Plex Mono',monospace; color:var(--faint)\">0.4 MB<\u002Fspan><\u002Fdiv>\n                <div style=\"font:400 11px/1 'IBM Plex Mono',monospace; color:var(--ok); margin-top:7px\">Uploaded · queued for processing<\u002Fdiv>\n              <\u002Fdiv>\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"var(--ok)\" stroke-width=\"2\"><path d=\"M3.5 8.5L6.5 11.5 12.5 5\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:8px; justify-content:flex-end; padding:14px 20px; border-top:1px solid var(--border); background:var(--surface-2)\">\n          <button sc-camel-on-click=\"{{ closeUpload }}\" style=\"height:32px; padding:0 13px; border-radius:7px; background:var(--surface); color:var(--fg); border:1px solid var(--border); font:500 12.5px/1 'Instrument Sans',sans-serif; cursor:pointer\">Cancel<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ closeUpload }}\" style=\"height:32px; padding:0 13px; border-radius:7px; background:var(--btn-bg); color:var(--btn-fg); border:0; font:500 12.5px/1 'Instrument Sans',sans-serif; cursor:pointer\">Start processing<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toastVisible }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:fixed; right:20px; bottom:20px; z-index:70; display:flex; flex-direction:column; gap:8px; align-items:flex-end\">\n      <div style=\"display:flex; align-items:center; gap:10px; padding:11px 14px; background:var(--surface); border:1px solid var(--border); border-radius:9px; box-shadow:0 8px 24px rgba(10,10,14,.14); font-size:12.5px\">\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"var(--ok)\" stroke-width=\"2\" style=\"flex:none\"><circle cx=\"8\" cy=\"8\" r=\"6.2\" stroke=\"var(--ok)\" opacity=\".3\"><\u002Fcircle><path d=\"M5 8.3L7 10.3 11 6\"><\u002Fpath><\u002Fsvg>\n        <span>Document processing started.<\u002Fspan>\n        <span style=\"font:400 11.5px/1 'IBM Plex Mono',monospace; color:var(--faint)\">now<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;overview&quot;,&quot;conversations&quot;,&quot;knowledge&quot;,&quot;document&quot;,&quot;playground&quot;,&quot;agents&quot;,&quot;analytics&quot;,&quot;evaluations&quot;,&quot;usage&quot;,&quot;widget&quot;,&quot;billing&quot;,&quot;settings&quot;,&quot;onboarding&quot;],&quot;default&quot;:&quot;overview&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;darkMode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;compactSidebar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prototype&quot;}}\">\nconst SCREENS = ['overview','conversations','knowledge','document','playground','agents','analytics','evaluations','usage','widget','billing','settings','onboarding'];\nconst CRUMBS = { overview:'Overview', conversations:'Conversations', knowledge:'Knowledge', document:'Billing & Subscriptions.pdf', playground:'AI Playground', agents:'Agent console', analytics:'Analytics', evaluations:'Evaluations', usage:'Usage & cost', widget:'Widget', billing:'Billing', settings:'Settings', onboarding:'Onboarding' };\n\nconst SERIES = {\n  '7': [[62,9],[71,12],[58,8],[80,14],[92,11],[47,6],[39,5]],\n  '30': [[41,7],[52,9],[48,6],[60,11],[57,8],[66,10],[72,13],[64,9],[58,7],[70,12],[81,14],[76,10],[69,9],[62,8],[74,11],[85,15],[79,12],[71,9],[66,8],[73,10],[88,13],[92,16],[84,11],[77,9],[69,7],[75,11],[90,14],[95,12],[87,10],[80,9]],\n  '90': [[30,8],[38,9],[44,11],[41,8],[52,12],[49,10],[57,13],[62,11],[55,9],[64,14],[71,12],[68,10],[60,9],[73,15],[79,13],[74,11],[66,10],[81,14],[88,12],[83,11],[76,9],[85,13],[92,15],[95,12],[87,10],[79,9],[90,14],[97,13],[89,11],[82,10]]\n};\n\nconst BRANDS = { indigo:'#3459e6', teal:'#0e7c74', plum:'#7a3b8f', ink:'#1d2433' };\n\nclass Component extends DCLogic {\n  state = { screen:'overview', dark:false, collapsed:false, range:'30', upload:false, drawer:false, brand:'indigo', pos:'right', narrow:false };\n\n  set(k, v) { return () => this.setState({ [k]: v }); }\n\n  ring(b) { return this.state.brand === b ? '2px solid var(--fg)' : '2px solid transparent'; }\n\n  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }\n\n  chart() {\n    const data = SERIES[this.state.range];\n    const W = 900, H = 190, gap = data.length > 20 ? 2 : 8;\n    const bw = (W - gap * (data.length - 1)) / data.length;\n    const max = Math.max(...data.map(d => d[0] + d[1])) * 1.12;\n    const bars = [];\n    data.forEach((d, i) => {\n      const x = i * (bw + gap);\n      const ha = (d[1] / max) * H, hb = (d[0] / max) * H;\n      bars.push(React.createElement('rect', { key:'b'+i, x, y:H-hb-ha, width:bw, height:hb, rx:Math.min(2,bw/3), fill:'var(--accent)' }));\n      bars.push(React.createElement('rect', { key:'h'+i, x, y:H-ha, width:bw, height:ha, rx:Math.min(2,bw/3), fill:'var(--warn)' }));\n    });\n    const grid = [0,0.25,0.5,0.75,1].map((f,i) => React.createElement('line', { key:'g'+i, x1:0, x2:W, y1:H*f, y2:H*f, stroke:'var(--border)', strokeWidth:1 }));\n    return React.createElement('svg', { viewBox:`0 -4 ${W} ${H+22}`, width:'100%', height:212, preserveAspectRatio:'none', style:{ display:'block' } },\n      grid, bars);\n  }\n\n  navStyle(id) {\n    const on = this.state.screen === id;\n    return { bg: on ? 'var(--accent-soft)' : 'transparent', fg: on ? 'var(--accent-fg)' : 'var(--muted)' };\n  }\n  rangeStyle(r) {\n    const on = this.state.range === r;\n    return { bg: on ? 'var(--surface)' : 'transparent', fg: on ? 'var(--fg)' : 'var(--muted)' };\n  }\n\n  componentDidMount() {\n    this._onResize = () => {\n      const n = window.innerWidth < 1100;\n      if (n !== this.state.narrow) this.setState({ narrow: n });\n    };\n    window.addEventListener('resize', this._onResize);\n    this._onResize();\n    const p = this.props || {};\n    const next = {};\n    if (p.startScreen && SCREENS.indexOf(p.startScreen) !== -1) next.screen = p.startScreen;\n    if (p.darkMode === true) next.dark = true;\n    if (p.compactSidebar === true) next.collapsed = true;\n    if (Object.keys(next).length) this.setState(next);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const go = {}; SCREENS.forEach(id => go[id] = this.set('screen', id));\n    const nav = {}; SCREENS.forEach(id => nav[id] = this.navStyle(id));\n    const v = {\n      theme: s.dark ? 'dark' : 'light',\n      expanded: !s.collapsed,\n      railWidth: s.collapsed ? '58px' : '232px',\n      footerAlign: s.collapsed ? 'center' : 'flex-start',\n      crumb: CRUMBS[s.screen],\n      go, nav,\n      toggleTheme: () => this.setState(p => ({ dark: !p.dark })),\n      toggleRail: () => this.setState(p => ({ collapsed: !p.collapsed })),\n      setRange7: this.set('range','7'), setRange30: this.set('range','30'), setRange90: this.set('range','90'),\n      range7: this.rangeStyle('7'), range30: this.rangeStyle('30'), range90: this.rangeStyle('90'),\n      volumeChart: this.chart(),\n      uploadOpen: s.upload,\n      openUpload: this.set('upload', true),\n      closeUpload: this.set('upload', false),\n      drawerOpen: s.drawer,\n      openDrawer: this.set('drawer', true),\n      closeDrawer: this.set('drawer', false),\n      brandColor: BRANDS[s.brand],\n      brandRing: { indigo: this.ring('indigo'), teal: this.ring('teal'), plum: this.ring('plum'), ink: this.ring('ink') },\n      setBrandIndigo: this.set('brand','indigo'), setBrandTeal: this.set('brand','teal'),\n      setBrandPlum: this.set('brand','plum'), setBrandInk: this.set('brand','ink'),\n      setPosRight: this.set('pos','right'), setPosLeft: this.set('pos','left'),\n      posRight: { bg: s.pos === 'right' ? 'var(--surface)' : 'transparent', fg: s.pos === 'right' ? 'var(--fg)' : 'var(--muted)' },\n      posLeft: { bg: s.pos === 'left' ? 'var(--surface)' : 'transparent', fg: s.pos === 'left' ? 'var(--fg)' : 'var(--muted)' },\n      previewAlign: s.pos === 'left' ? 'flex-start' : 'flex-end',\n      toastVisible: s.screen === 'knowledge',\n      colDir: s.narrow ? 'column' : 'row',\n      colHeight: s.narrow ? 'auto' : '100%',\n      colMinHeight: s.narrow ? '0' : '560px',\n      sideW: s.narrow ? '100%' : '302px',\n      sideBorder: s.narrow ? '0 0 1px 0' : '0 1px 0 0',\n      detailW: s.narrow ? '100%' : '280px',\n      inspectorW: s.narrow ? '100%' : '340px',\n      threadMin: s.narrow ? 'auto' : '0',\n      threadFloor: s.narrow ? '0' : '380px',\n      threadBorder: s.narrow ? '0 0 1px 0' : '0 1px 0 0'\n    };\n    SCREENS.forEach(id => v['is' + id[0].toUpperCase() + id.slice(1)] = s.screen === id);\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
